{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    {% block titulo %}
    <title>Plantilla</title>
    {% endblock %}

    <link rel="stylesheet" href="{% static 'css/flatly.css' %}">
    <link rel="stylesheet" href="{% static 'css/datatables.css' %}">
    <!-- <link rel="stylesheet" href="{% static 'css/estilos.css' %}"> -->

    <link rel="shortcut icon" href="{% static 'images/logo.png' %}" type="image/x-icon">
    {% block estilos %}{% endblock %}

    <script src="{% static 'js/bootstrap.bundle.js' %}"></script>
    <script src="{% static 'js/jquery_v4.0.0.js' %}"></script>
    <script src="{% static 'js/datatables.js' %}"></script>
    <script src="{% static 'js/datatables_default.js' %}"></script>
    {% block script %}{% endblock %}
</head>

<body>

    <nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'inicio' %}"><span>📚</span> BiblioHUB</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarColor01"
                aria-controls="navbarColor01" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarColor01">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" data-bs-toggle="dropdown" href="#" role="button"
                            aria-haspopup="true" aria-expanded="false">Catálogo</a>
                        <div class="dropdown-menu">
                            <a class="dropdown-item" href="#">Libros</a>
                            <a class="dropdown-item" href="{% url 'listado_autores' %}">Autores</a>
                            <a class="dropdown-item" href="#">Editoriales</a>
                        </div>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Usuarios</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Préstamos</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido principal -->
    <main class="container">
        <div class="hero-content">
            <br>

            {% block contenido %}

            {% endblock %}

        </div>

    </main>

    {% block scriptPagina %}
    {% endblock %}

</body>

</html>
