<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    {% block titulo %}    
        <title>Plantilla</title>
    {% endblock %}

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #263238;
        }

        /* Barra de navegación */
        nav {
            height: 70px;
            background: #263238;
            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 8%;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .logo span {
            margin-right: 8px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            font-size: 0.95rem;
        }

        nav a:hover {
            color: #90caf9;
        }

        /* Hero */
        .hero {
            min-height: calc(100vh - 70px);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 40px 8%;

            background:
                linear-gradient(
                    135deg,
                    #e3f2fd 0%,
                    #ffffff 55%,
                    #f4f6f8 100%
                );
        }

        .hero-content {
            max-width: 900px;
            text-align: center;
        }

        .book-icon {
            font-size: 5rem;
            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 15px;
            color: #263238;
        }

        .hero h1 span {
            color: #1976d2;
        }

        .hero h2 {
            font-size: 1.5rem;
            font-weight: normal;
            color: #546e7a;
            margin-bottom: 25px;
        }

        .hero p {
            max-width: 650px;
            margin: 0 auto 35px;
            line-height: 1.7;
            color: #607d8b;
            font-size: 1.05rem;
        }

        /* Botones */
        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 13px 25px;
            border-radius: 7px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-primary {
            background: #1976d2;
            color: white;
        }

        .btn-primary:hover {
            background: #1565c0;
            transform: translateY(-2px);
        }

        .btn-secondary {
            border: 1px solid #1976d2;
            color: #1976d2;
            background: white;
        }

        .btn-secondary:hover {
            background: #e3f2fd;
        }

        /* Tarjetas inferiores */
        .features {
            display: flex;
            justify-content: center;
            gap: 20px;

            margin-top: 55px;
            flex-wrap: wrap;
        }

        .feature {
            width: 180px;
            padding: 20px;

            background: white;
            border-radius: 10px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
        }

        .feature-icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .feature h3 {
            font-size: 1rem;
            margin-bottom: 5px;
        }

        .feature p {
            font-size: 0.85rem;
            margin: 0;
        }

        /* Responsive */
        @media (max-width: 600px) {

            nav {
                padding: 0 5%;
            }

            nav .links {
                display: none;
            }

            .hero h1 {
                font-size: 2.5rem;
            }

            .hero h2 {
                font-size: 1.2rem;
            }

            .book-icon {
                font-size: 4rem;
            }
        }
    </style>
</head>

<body>

    <!-- Navegación -->
    <nav>
        <div class="logo">
            <span>📚</span> BiblioHUB
        </div>

        <div class="links">
            <a href="#">Inicio</a>
            <a href="#">Catálogo</a>
            <a href="#">Usuarios</a>
            <a href="#">Préstamos</a>
        </div>
    </nav>


    <!-- Contenido principal -->
    <main class="hero">

        <div class="hero-content">

           {% block contenido %}    

            {% endblock %}

        </div>

    </main>

</body>
</html>
