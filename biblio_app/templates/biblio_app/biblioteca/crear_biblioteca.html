{% extends 'base.html' %}
{% load static %}

{% block titulo %}
<title>Crear Biblioteca</title>
{% endblock %}

{% block script %}
<!-- <script src="{% static 'js/biblio_app/regiones/regiones.js' %}"></script> -->
{% endblock %}

{% block contenido %}

<h3>Agregar Biblioteca</h3>
<br>

<form action="" method="post">
    <div class="row">
        <div class="col">
            <label for="nombre" class="form-label">Nombre:</label>
            <input type="text" class="form-control" id="nombre" name="nombre" value="Nombre Biblioteca...">
        </div>

        <div class="col">
            <label for="web" class="form-label">Web:</label>
            <input type="url" class="form-control" id="web" name="web" value="Dirección web...">
        </div>
    </div>
    <br>
    
    <div class="row">
        <div class="col">
            <label for="correo" class="form-label">Correo:</label>
            <input type="email" class="form-control" id="correo" name="correo" value="Correo Contacto...">
        </div>

        <div class="col">
            <label for="telefono" class="form-label">Teléfono:</label>
            <input type="tel" class="form-control" id="telefono" name="telefono" placeholder    ="Teléfono Contacto...">
        </div>
    </div>
</form>

{% endblock %}
